[project]
name = "rag-porfolio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdul Rehman", email = "m.abdulrehman.shoukat@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-chroma>=0.1",
    "langchain-community>=0.3",
    "chromadb>=0.5",
    "flashrank>=0.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "pdfminer-six>=20260107",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "deepeval>=1.0",
    "ragas>=0.2",
    "httpx>=0.27",
]

[project.scripts]
rag-porfolio = "rag_porfolio:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests (no external API calls)",
    "integration: integration tests (requires OPENAI_API_KEY)",
    "evaluation: evaluation tests (requires OPENAI_API_KEY)",
]
