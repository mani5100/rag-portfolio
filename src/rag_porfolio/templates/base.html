<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Portfolio</title>

    <!-- DaisyUI (must come before Tailwind so Tailwind can purge daisyui classes) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>

    <!-- HTMX SSE extension -->
    <script src="https://unpkg.com/htmx-ext-sse@2.0.0/sse.js"></script>
</head>
<body class="min-h-screen bg-base-200">

    <!-- Nav bar -->
    <nav class="navbar bg-base-100 shadow-sm border-b border-base-300">
        <div class="container mx-auto">
            <div class="flex-1">
                <a class="text-xl font-bold tracking-tight text-primary">RAG Portfolio</a>
            </div>
            <div class="flex-none">
                <span class="badge badge-outline badge-sm">Retrieval-Augmented Generation</span>
            </div>
        </div>
    </nav>

    <!-- Page content -->
    <main class="container mx-auto py-6 px-4">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
